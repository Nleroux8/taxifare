[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "No�e Leroux", email = "noe.leroux20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bigquery>=0.0.45",
    "fastapi>=0.165.0",
    "google>=3.0.0",
    "numpy>=2.5.5",
    "db-dtypes>=1.9.0",
    "google-cloud>=0.34.0",
    "matplotlib>=3.11.2",
    "pandas<3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
